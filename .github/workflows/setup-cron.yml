name: Setup cron jobs

# One-shot (re-runnable) installer for the server-side scheduled jobs:
#   - rating sync once a day (04:00 server time)
#   - follow-up reminders every 6 hours
# Copies scripts/feedback-cron.sh to the server, installs the crontab
# idempotently, then runs both jobs once so we can see they work. The job
# script reads SYNC_API_KEY from the on-server .env.production, so no secret is
# needed here beyond the existing deploy SSH key.
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cron + smoke-run
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $HOME/.ssh/id_deploy"
          scp $SSHOPTS -P "$PORT" scripts/feedback-cron.sh "$USER@$HOST:/home/bitrix/feedback-cron.sh"
          ssh $SSHOPTS -p "$PORT" "$USER@$HOST" "\
            sed -i 's/\r$//' /home/bitrix/feedback-cron.sh && \
            chmod +x /home/bitrix/feedback-cron.sh && \
            ( crontab -l 2>/dev/null | grep -v feedback-cron.sh ; \
              echo '0 4 * * * /home/bitrix/feedback-cron.sh rating >> /home/bitrix/feedback-cron.log 2>&1' ; \
              echo '15 */6 * * * /home/bitrix/feedback-cron.sh followup >> /home/bitrix/feedback-cron.log 2>&1' \
            ) | crontab - && \
            echo '=== crontab (feedback) ===' && crontab -l | grep feedback-cron.sh && \
            echo '=== diag ===' && /home/bitrix/feedback-cron.sh diag || true; \
            echo '=== smoke: rating ===' && /home/bitrix/feedback-cron.sh rating || true; \
            echo '=== smoke: followup ===' && /home/bitrix/feedback-cron.sh followup || true; \
            echo done"
