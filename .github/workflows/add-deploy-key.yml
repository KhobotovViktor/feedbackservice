name: Add deploy key

# One-shot bootstrap: append the CI public key to the server's
# authorized_keys, using the password (from a GitHub runner IP, not under the
# local fail2ban ban). Run once, then the Deploy workflow uses the key.
on:
  workflow_dispatch:

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Append CI public key
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          PUBKEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJjE+IDzGdYR7Rc4oRv57gDiNdBo9Dxg+4OO0DsK/+EC github-actions-deploy"
          SSHOPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $SSHOPTS -p "$PORT" "$USER@$HOST" "mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && grep -qF '$PUBKEY' ~/.ssh/authorized_keys || echo '$PUBKEY' >> ~/.ssh/authorized_keys; echo done"
