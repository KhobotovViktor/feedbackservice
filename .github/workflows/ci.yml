name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The build never connects to the DB (all routes are dynamic), but
      # Prisma wants a URL present. These are throwaway placeholders.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
      NEXT_PUBLIC_APP_URL: https://feedback.alleyadoma.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install (not ci): vitest's platform-optional deps (@emnapi/*,
      # native esbuild/rollup) aren't enumerated for Linux in a Windows-
      # generated lockfile, so `npm ci`'s strict sync check fails.
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint (non-blocking)
        run: npx eslint src
        continue-on-error: true
